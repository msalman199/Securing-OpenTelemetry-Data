extensions:
  headers_setter:
    headers:
      - action: insert
        key: "X-API-Key"
        from_context: "api_key"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /certs/server-cert.pem
          key_file: /certs/server-key.pem
          ca_file: /certs/ca.pem
          client_ca_file: /certs/ca.pem
        auth:
          authenticator: headers_auth
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /certs/server-cert.pem
          key_file: /certs/server-key.pem
          ca_file: /certs/ca.pem
          client_ca_file: /certs/ca.pem
        auth:
          authenticator: headers_auth

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  
  # Resource processor to add security context
  resource:
    attributes:
      - key: security.tls.enabled
        value: "true"
        action: insert
      - key: security.auth.method
        value: "mutual-tls"
        action: insert
  
  # Attributes processor for data sanitization
  attributes:
    actions:
      - key: sensitive_data
        action: hash
      - key: password
        action: delete
      - key: credit_card
        action: delete
      - key: ssn
        action: delete

exporters:
  # Secure file exporter
  file:
    path: /data/secure-telemetry.json
    rotation:
      max_megabytes: 10
      max_days: 7
      max_backups: 5
  
  # Secure OTLP exporter (for forwarding to another collector)
  otlp/secure:
    endpoint: "https://localhost:4317"
    tls:
      cert_file: /certs/client-cert.pem
      key_file: /certs/client-key.pem
      ca_file: /certs/ca.pem
      server_name_override: "otel-collector"
    headers:
      api-key: "otel-consumer-key-67890"

service:
  extensions: [headers_setter]
  
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, attributes, batch]
      exporters: [file]
    
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [file]
    
    logs:
      receivers: [otlp]
      processors: [resource, attributes, batch]
      exporters: [file]
  
  telemetry:
    logs:
      level: info
    metrics:
      address: 127.0.0.1:8888
      level: detailed
